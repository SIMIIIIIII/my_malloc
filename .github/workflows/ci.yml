name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcunit1 libcunit1-dev clang

    - name: Build project
      run: make matrix.o

    - name: Run tests
      run: make test

    - name: Run resume tests
      run: make resume
